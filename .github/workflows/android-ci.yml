name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Run unit tests, compile instrumentation and assemble debug/release APKs
        run: ./gradlew --no-daemon testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug assembleRelease lint

      - name: Detect Linux emulator acceleration
        id: emulator-accel
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "tcg=false" >> "$GITHUB_OUTPUT"
            echo "KVM available; Android 17 emulator will use hardware acceleration."
          else
            echo "tcg=true" >> "$GITHUB_OUTPUT"
            echo "KVM unavailable; use the Android 17 image with TCG for the runtime test."
          fi

      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: ${{ steps.emulator-accel.outputs.tcg == 'true' && 'yes' || '' }}
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          disable-linux-hw-accel: ${{ steps.emulator-accel.outputs.tcg == 'true' }}
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: missed-prayers-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn

      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v7
        with:
          name: missed-prayers-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
